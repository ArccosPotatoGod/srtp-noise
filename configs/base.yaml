sim:
  fs: 16000
  duration: null

room:
  dim: [6.0, 5.0, 6.0]
  rt60: 0.18
  temperature: 20.0
  humidity: 50.0

source:
  pos: [1.0, 2.5, 1.5]
  audio_dataset: "librispeech"
  audio_file: data/speech-1.wav

jammer:
  pos_spk: [1.0, 2.5, 1.5]       # co-located with source for RIR matching
  ref_mic_pos: [1.001, 2.5, 1.5]  # 1 cm from source — near-direct pickup
  canceling_strategy: "phase_inversion"
  coherent_strategy: "fixed_weight"
  system_gain_db: 20.0
  canceling_params:
    gain: 1.0
    precompensate: true
  coherent_params:
    time_coupling: true
    freq_coupling: true
    mixing_dim: 3

spy_mic:
  positions:
    - [4.0, 2.5, 1.5]
    - [4.0, 2.65, 1.5]    # second mic for multi-channel ICA (15 cm y-spacing)
  nonlinearity: "polynomial"
  nonlinearity_params:
    coeff: [1.0, 0.1, 0.0]

attacker:
  denoiser: "ica"
  asr: "whisper_tiny"
  denoiser_params: {}
    # n_channels auto-detected from number of spy mics

ultrasonic:
  carrier_freq: 39000
  attenuation_db_per_m: 1.5
  apply_to_rir: true
